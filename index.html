<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bedrock認証</title>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2b2d31;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #f2f3f5; margin-bottom: 15px; }
        p { font-size: 14px; color: #949ba4; word-break: break-all; }
        .success { color: #23a55a; font-weight: bold; }
        .error { color: #f23f43; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Discord認証システム</h2>
        <div id="content">
            <p>認証情報を処理しています...</p>
        </div>
    </div>

    <script>
        // パソコンで動いているPythonボット（ngrok経由）のAPIエンドポイント
        const BOT_API_URL = "https://worsening-superhero-smile.ngrok-free.dev/api/auth";[cite: 1]

        // URLのパラメータから `code` を自動で取得する
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const contentDiv = document.getElementById('content');

        async function sendCode(authCode) {
            try {
                // パソコン上のボットへ自動送信
                const response = await fetch(BOT_API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: authCode })
                });

                const result = await response.json();

                if (response.ok) {
                    contentDiv.innerHTML = `
                        <p class="success">✅ 認証が完了し、サーバーへの自動追加まで成功しました！</p>
                        <p style="font-size: 12px; margin-top: 10px;">この画面は閉じても大丈夫です。</p>
                    `;
                } else {
                    contentDiv.innerHTML = `
                        <p class="error">❌ 処理に失敗しました。</p>
                        <p style="font-size: 12px; color: #949ba4;">詳細: ${result.message || '不明なエラー'}</p>
                    `;
                }
            } catch (err) {
                contentDiv.innerHTML = `
                    <p class="error">❌ ボットへの接続に失敗しました。</p>
                    <p style="font-size: 12px; color: #949ba4;">パソコンでボットとngrokが起動しているか確認してください。</p>
                `;
            }
        }

        if (code) {
            sendCode(code);
        } else {
            contentDiv.innerHTML = `
                <p class="error">❌ 認証コードが見つかりません。</p>
                <p>正しいURLからアクセスしてください。</p>
            `;
        }
    </script>

</body>
</html>
