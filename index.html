<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord 認証</title>
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #2b2d31; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn { display: inline-block; background-color: #5865F2; color: white; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .btn:hover { background-color: #4752C4; }
    </style>
</head>
<body>
    <div class="card">
        <h2>サーバー参加認証</h2>
        <p>下のボタンを押してDiscord連携を完了してください。</p>
        <!-- 実際のDiscord認可URL（client_idとredirect_uriを設定したもの）に書き換えてください -->
        <a href="https://discord.com/api/oauth2/authorize?client_id=1560085371210047541&redirect_uri=https%3A%2F%2Ftubasa82ytdiscordwebninsyou.vercel.app%2F&response_type=code&scope=identify+guilds.join" class="btn">Discordで認証する</a>
    </div>
</body>
</html>
